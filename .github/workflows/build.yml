name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSVC 2022
            os: windows-2022
          - name: Linux GCC
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Linux: the demo uses the GTE OpenGL 4.5 / GLX backend.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libgl-dev libopengl-dev libegl-dev libpng-dev

      # Builds the geometry header checks, the tests and the demo application
      # (Windows: GTE DirectX 11 backend, Linux: GTE OpenGL backend).
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DGC_BUILD_APP=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
